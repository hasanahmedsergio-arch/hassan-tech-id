<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hassan Tech – ID Verification</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#17104f,#4b2aa8);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;color:#222}
.card{width:min(440px,100%);background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 25px 60px #0005}
.header{padding:28px;background:linear-gradient(135deg,#4b2aa8,#302080);color:white;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:white;color:#40269a;display:grid;place-items:center;font-weight:800;font-size:25px;margin:0 auto 12px}
.header h1{margin:0;font-size:25px}.header p{margin:8px 0 0;opacity:.85}
.body{padding:25px}.status{display:inline-flex;align-items:center;gap:8px;background:#eafaf0;color:#168044;padding:9px 13px;border-radius:999px;font-weight:700;font-size:14px;margin-bottom:20px}
.dot{width:9px;height:9px;background:#20b765;border-radius:50%}
.profile{display:flex;gap:16px;align-items:center;padding-bottom:20px;border-bottom:1px solid #eee}
.photo{width:82px;height:100px;object-fit:cover;border-radius:14px;background:#eee}
.name{font-size:22px;font-weight:800;margin:0 0 6px}.role{color:#6d6680;margin:0}
.info{margin-top:18px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #f0eef4}.label{color:#777;font-size:13px}.value{font-weight:700;text-align:right}
.footer{padding:18px 25px;background:#faf9fc;text-align:center;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">HT</div>
    <h1>Hassan Tech</h1>
    <p>ID Verification</p>
  </div>
  <div class="body">
    <div class="status"><span class="dot"></span> ID Verified</div>
    <div class="profile">
      <div class="photo"></div>
      <div><p class="name">Hassan Ahmet</p><p class="role">ICT</p></div>
    </div>
    <div class="info">
      <div class="row"><span class="label">ID Number</span><span class="value">123456789</span></div>
      <div class="row"><span class="label">Date of Birth</span><span class="value">01/01/2003</span></div>
      <div class="row"><span class="label">Join Date</span><span class="value">01/01/2026</span></div>
      <div class="row"><span class="label">Expiry Date</span><span class="value">01/01/2030</span></div>
      <div class="row"><span class="label">Phone</span><span class="value">+2520633455469</span></div>
    </div>
  </div>
  <div class="footer">Hassan Tech • Official ID Verification Page</div>
</div>
</body>
</html>
